<?xml version="1.0" encoding="UTF-8"?>
<!--
  Property card SVG template — self-produced, Hasbro trade-dress free.
  Placeholders (replaced at render time by scripts/render_cards.py):
    {{NAME}}         - property name
    {{COLOR_HEX}}    - color group hex, e.g. #E91E63
    {{PRICE_BUY}}    - e.g. "$140"
    {{RENT_BASE}}    - rent with no buildings
    {{RENT_H1..H4}}  - rent with 1..4 houses
    {{RENT_HOTEL}}   - rent with hotel
    {{PRICE_HOUSE}}  - e.g. "$100"
    {{PRICE_HOTEL}}  - e.g. "$100 + 4 houses"
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <rect x="0" y="0" width="240" height="360" fill="#FEFEFE" stroke="#222" stroke-width="2" rx="8"/>

  <!-- color stripe -->
  <rect x="8" y="8" width="224" height="60" fill="{{COLOR_HEX}}" stroke="#222" stroke-width="1"/>
  <text x="120" y="46" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"
        text-anchor="middle" fill="#FFF" stroke="#000" stroke-width="0.5">{{NAME}}</text>

  <!-- title bar -->
  <text x="120" y="92" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600"
        text-anchor="middle" fill="#333">TITLE DEED</text>

  <!-- rent table -->
  <g font-family="Inter,Arial,sans-serif" font-size="11" fill="#222">
    <text x="20"  y="120">Rent</text>                                         <text x="220" y="120" text-anchor="end" font-weight="600">{{RENT_BASE}}</text>
    <text x="20"  y="140">With 1 House</text>                                 <text x="220" y="140" text-anchor="end">{{RENT_H1}}</text>
    <text x="20"  y="160">With 2 Houses</text>                                <text x="220" y="160" text-anchor="end">{{RENT_H2}}</text>
    <text x="20"  y="180">With 3 Houses</text>                                <text x="220" y="180" text-anchor="end">{{RENT_H3}}</text>
    <text x="20"  y="200">With 4 Houses</text>                                <text x="220" y="200" text-anchor="end">{{RENT_H4}}</text>
    <text x="20"  y="220">With HOTEL</text>                                   <text x="220" y="220" text-anchor="end" font-weight="700">{{RENT_HOTEL}}</text>
  </g>

  <line x1="20" y1="235" x2="220" y2="235" stroke="#999" stroke-width="0.5"/>

  <!-- costs -->
  <g font-family="Inter,Arial,sans-serif" font-size="10" fill="#444">
    <text x="20"  y="258">House cost</text>                                   <text x="220" y="258" text-anchor="end">{{PRICE_HOUSE}}</text>
    <text x="20"  y="274">Hotel cost</text>                                   <text x="220" y="274" text-anchor="end">{{PRICE_HOTEL}}</text>
  </g>

  <!-- price -->
  <rect x="20" y="296" width="200" height="42" fill="#F5F5F5" stroke="#CCC" rx="4"/>
  <text x="30" y="322" font-family="Inter,Arial,sans-serif" font-size="11" fill="#666">PRICE</text>
  <text x="210" y="322" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"
        text-anchor="end" fill="#1B5E20">{{PRICE_BUY}}</text>
</svg>

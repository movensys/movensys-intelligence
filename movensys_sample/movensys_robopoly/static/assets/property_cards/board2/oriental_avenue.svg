<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <rect x="0" y="0" width="240" height="360" fill="#FEFEFE" stroke="#222" stroke-width="2" rx="8"/>

  
  <rect x="8" y="8" width="224" height="60" fill="#87CEEB" stroke="#222" stroke-width="1"/>
  <text x="120" y="46" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"
        text-anchor="middle" fill="#FFF" stroke="#000" stroke-width="0.5">Oriental Avenue</text>

  
  <text x="120" y="92" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600"
        text-anchor="middle" fill="#333">TITLE DEED</text>

  
  <g font-family="Inter,Arial,sans-serif" font-size="11" fill="#222">
    <text x="20"  y="120">Rent</text>                                         <text x="220" y="120" text-anchor="end" font-weight="600">$6</text>
    <text x="20"  y="140">With 1 House</text>                                 <text x="220" y="140" text-anchor="end">$30</text>
    <text x="20"  y="160">With 2 Houses</text>                                <text x="220" y="160" text-anchor="end">$90</text>
    <text x="20"  y="180">With 3 Houses</text>                                <text x="220" y="180" text-anchor="end">$270</text>
    <text x="20"  y="200">With 4 Houses</text>                                <text x="220" y="200" text-anchor="end">$400</text>
    <text x="20"  y="220">With HOTEL</text>                                   <text x="220" y="220" text-anchor="end" font-weight="700">$550</text>
  </g>

  <line x1="20" y1="235" x2="220" y2="235" stroke="#999" stroke-width="0.5"/>

  
  <g font-family="Inter,Arial,sans-serif" font-size="10" fill="#444">
    <text x="20"  y="258">House cost</text>                                   <text x="220" y="258" text-anchor="end">$50</text>
    <text x="20"  y="274">Hotel cost</text>                                   <text x="220" y="274" text-anchor="end">$50 + 4 houses</text>
  </g>

  
  <rect x="20" y="296" width="200" height="42" fill="#F5F5F5" stroke="#CCC" rx="4"/>
  <text x="30" y="322" font-family="Inter,Arial,sans-serif" font-size="11" fill="#666">PRICE</text>
  <text x="210" y="322" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"
        text-anchor="end" fill="#1B5E20">$100</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <rect x="0" y="0" width="240" height="360" fill="#FEFEFE" stroke="#222" stroke-width="2" rx="8"/>
  <rect x="8" y="8" width="224" height="60" fill="#222" stroke="#222" stroke-width="1"/>
  <text x="120" y="46" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"
        text-anchor="middle" fill="#FFF">Reading Railroad</text>

  <text x="120" y="92" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600"
        text-anchor="middle" fill="#333">RAILROAD</text>

  
  <g transform="translate(80 108)" fill="#333">
    <rect x="8"  y="18" width="60" height="22" rx="2"/>
    <rect x="22" y="6"  width="24" height="14" rx="2"/>
    <circle cx="20" cy="46" r="6"/>
    <circle cx="56" cy="46" r="6"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="11" fill="#222">
    <text x="20"  y="190">Rent (1 RR owned)</text>                            <text x="220" y="190" text-anchor="end">$25</text>
    <text x="20"  y="208">If 2 RRs owned</text>                               <text x="220" y="208" text-anchor="end">$50</text>
    <text x="20"  y="226">If 3 RRs owned</text>                               <text x="220" y="226" text-anchor="end">$100</text>
    <text x="20"  y="244">If 4 RRs owned</text>                               <text x="220" y="244" text-anchor="end" font-weight="700">$200</text>
  </g>

  <rect x="20" y="296" width="200" height="42" fill="#F5F5F5" stroke="#CCC" rx="4"/>
  <text x="30" y="322" font-family="Inter,Arial,sans-serif" font-size="11" fill="#666">PRICE</text>
  <text x="210" y="322" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"
        text-anchor="end" fill="#1B5E20">$200</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>movensys-monopoly</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>movensys-monopoly</h1>
    <span class="badge" id="milestone">M1 board 3</span>
    <div class="spacer"></div>
    <div class="badges" id="modes"></div>
  </header>
  <main class="grid">
    <section class="board-pane">
      <div id="board-host" aria-label="Board"></div>
      <svg id="pieces" viewBox="0 0 300 500">
        <circle id="piece-user"  r="18" cx="250" cy="450" fill="var(--user)"  stroke="#000" stroke-width="1.5"/>
        <circle id="piece-robot" r="18" cx="250" cy="450" fill="var(--robot)" stroke="#000" stroke-width="1.5" transform="translate(-30 0)"/>
      </svg>
    </section>
    <section class="sidebar">
      <div class="card">
        <h2>Game state</h2>
        <dl>
          <dt>FSM</dt>     <dd id="st-fsm">IDLE</dd>
          <dt>Turn</dt>    <dd id="st-turn">—</dd>
          <dt>Turn #</dt>  <dd id="st-num">0</dd>
          <dt>Dice</dt>    <dd id="st-dice">—</dd>
          <dt>Winner</dt>  <dd id="st-winner">—</dd>
        </dl>
      </div>

      <div class="card">
        <h2>Manual controls</h2>
        <div class="row">
          <label>Board
            <select id="board-select">
              <option value="3" selected>3 — blank (12)</option>
              <option value="1">1 — short (20)</option>
              <option value="2">2 — full (40)</option>
            </select>
          </label>
          <button id="btn-start">Start</button>
        </div>
        <div class="row">
          <label>Dice
            <input id="dice-input" type="number" min="1" max="6" value="3">
          </label>
          <button id="btn-submit-dice">Submit dice</button>
        </div>
        <div class="row">
          <button id="btn-apply-move" title="Applies the move the server is expecting">Apply move</button>
          <button id="btn-end-turn">End turn</button>
        </div>
      </div>

      <div class="card">
        <h2>Events</h2>
        <ol id="event-log"></ol>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>

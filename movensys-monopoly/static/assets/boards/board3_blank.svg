<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Board 3 — 12-tile headless smoke board</title>
  <desc>4x4 perimeter (12 tiles). Index 0 = START (bottom-right). Clockwise numbering.</desc>

  <rect x="0" y="0" width="400" height="400" fill="#F5F5F5" stroke="#333" stroke-width="2"/>

  <!-- inner play area -->
  <rect x="100" y="100" width="200" height="200" fill="#FAFAFA" stroke="#333" stroke-width="1"/>
  <text x="200" y="195" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600"
        text-anchor="middle" fill="#666">BOARD 3</text>
  <text x="200" y="220" font-family="Inter,Arial,sans-serif" font-size="12"
        text-anchor="middle" fill="#999">headless smoke</text>

  <!-- 0: START (bottom-right) -->
  <g>
    <rect x="300" y="300" width="100" height="100" fill="#C8E6C9" stroke="#333"/>
    <text x="350" y="355" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"
          text-anchor="middle" fill="#2E7D32">START</text>
    <text x="350" y="375" font-family="Inter,Arial,sans-serif" font-size="10"
          text-anchor="middle" fill="#2E7D32">0</text>
  </g>

  <!-- 1,2: bottom row, right→left -->
  <g><rect x="200" y="300" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="250" y="355" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">1</text></g>
  <g><rect x="100" y="300" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="150" y="355" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">2</text></g>

  <!-- 3: bottom-left corner -->
  <g><rect x="0" y="300" width="100" height="100" fill="#E3F2FD" stroke="#333"/>
     <text x="50" y="355" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">3</text></g>

  <!-- 4,5: left column, bottom→top -->
  <g><rect x="0" y="200" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="50" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">4</text></g>
  <g><rect x="0" y="100" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="50" y="155" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">5</text></g>

  <!-- 6: top-left corner -->
  <g><rect x="0" y="0" width="100" height="100" fill="#E3F2FD" stroke="#333"/>
     <text x="50" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">6</text></g>

  <!-- 7,8: top row, left→right -->
  <g><rect x="100" y="0" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="150" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">7</text></g>
  <g><rect x="200" y="0" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="250" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">8</text></g>

  <!-- 9: top-right corner -->
  <g><rect x="300" y="0" width="100" height="100" fill="#E3F2FD" stroke="#333"/>
     <text x="350" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">9</text></g>

  <!-- 10,11: right column, top→bottom -->
  <g><rect x="300" y="100" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="350" y="155" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">10</text></g>
  <g><rect x="300" y="200" width="100" height="100" fill="#FFF" stroke="#333"/>
     <text x="350" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">11</text></g>
</svg>

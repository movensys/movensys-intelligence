<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <title>Board 3 — 12-tile headless smoke board</title>
  <desc>5x3 rectangular perimeter. 12 tiles. Index 0 = START (top-left). Clockwise numbering. Tiles named after Korean cities.</desc>

  <rect x="0" y="0" width="500" height="300" fill="#F5F5F5" stroke="#111" stroke-width="4"/>

  <!-- inner play area (merged center: row 1, cols 1-3) -->
  <rect x="100" y="100" width="300" height="100" fill="#FAFAFA" stroke="#111" stroke-width="3"/>

  <!-- top row (left to right): 0 (START) / 1 / 2 / 3 / 4 -->
  <g>
    <rect x="0" y="0" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="50" y="50" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">START</text>
    <text x="50" y="72" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">0</text>
  </g>
  <g>
    <rect x="100" y="0" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="150" y="58" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Incheon</text>
    <text x="150" y="80" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">1</text>
  </g>
  <g>
    <rect x="200" y="0" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="250" y="58" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Suwon</text>
    <text x="250" y="80" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">2</text>
  </g>
  <g>
    <rect x="300" y="0" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="350" y="58" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Daejeon</text>
    <text x="350" y="80" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">3</text>
  </g>
  <g>
    <rect x="400" y="0" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="450" y="58" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Jeonju</text>
    <text x="450" y="80" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">4</text>
  </g>

  <!-- right column middle: 5 -->
  <g>
    <rect x="400" y="100" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="450" y="158" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Gwangju</text>
    <text x="450" y="180" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">5</text>
  </g>

  <!-- bottom row (right to left): 6 / 7 / 8 / 9 / 10 -->
  <g>
    <rect x="400" y="200" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="450" y="258" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Busan</text>
    <text x="450" y="280" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">6</text>
  </g>
  <g>
    <rect x="300" y="200" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="350" y="258" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Ulsan</text>
    <text x="350" y="280" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">7</text>
  </g>
  <g>
    <rect x="200" y="200" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="250" y="258" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800"
          text-anchor="middle" fill="#111">Daegu</text>
    <text x="250" y="280" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">8</text>
  </g>
  <g>
    <rect x="100" y="200" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="150" y="258" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800"
          text-anchor="middle" fill="#111">Gyeongju</text>
    <text x="150" y="280" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">9</text>
  </g>
  <g>
    <rect x="0" y="200" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="50" y="258" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800"
          text-anchor="middle" fill="#111">Gangneung</text>
    <text x="50" y="280" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">10</text>
  </g>

  <!-- left column middle: 11 -->
  <g>
    <rect x="0" y="100" width="100" height="100" fill="#FFF" stroke="#111" stroke-width="3"/>
    <text x="50" y="158" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800"
          text-anchor="middle" fill="#111">Chuncheon</text>
    <text x="50" y="180" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"
          text-anchor="middle" fill="#444">11</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <title>Board 3 — 12-tile headless smoke board</title>
  <desc>3x5 rectangular perimeter matching monopoly_board.drawio.png. 12 tiles. Index 0 = START (bottom-right). Clockwise numbering.</desc>

  <rect x="0" y="0" width="300" height="500" fill="#F5F5F5" stroke="#222" stroke-width="2"/>

  <!-- inner play area (merged center: column 1, rows 1-3) -->
  <rect x="100" y="100" width="100" height="300" fill="#FAFAFA" stroke="#222" stroke-width="1"/>
  <text x="150" y="240" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600"
        text-anchor="middle" fill="#666">BOARD 3</text>
  <text x="150" y="262" font-family="Inter,Arial,sans-serif" font-size="10"
        text-anchor="middle" fill="#999">headless smoke</text>

  <!-- top row: 6 (corner) / 7 / 8 (corner) -->
  <g><rect x="0" y="0" width="100" height="100" fill="#E3F2FD" stroke="#222"/>
     <text x="50" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#666">6</text></g>
  <g><rect x="100" y="0" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="150" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">7</text></g>
  <g><rect x="200" y="0" width="100" height="100" fill="#E3F2FD" stroke="#222"/>
     <text x="250" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#666">8</text></g>

  <!-- left column (bottom to top): 3, 4, 5 -->
  <g><rect x="0" y="300" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="50" y="355" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">3</text></g>
  <g><rect x="0" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="50" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">4</text></g>
  <g><rect x="0" y="100" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="50" y="155" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">5</text></g>

  <!-- right column (top to bottom): 9, 10, 11 -->
  <g><rect x="200" y="100" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="250" y="155" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">9</text></g>
  <g><rect x="200" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="250" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">10</text></g>
  <g><rect x="200" y="300" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="250" y="355" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">11</text></g>

  <!-- bottom row: 2 (corner) / 1 / 0 (START corner) -->
  <g><rect x="0" y="400" width="100" height="100" fill="#E3F2FD" stroke="#222"/>
     <text x="50" y="455" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#666">2</text></g>
  <g><rect x="100" y="400" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="150" y="455" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">1</text></g>
  <g>
    <rect x="200" y="400" width="100" height="100" fill="#C8E6C9" stroke="#222"/>
    <text x="250" y="450" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"
          text-anchor="middle" fill="#2E7D32">START</text>
    <text x="250" y="470" font-family="Inter,Arial,sans-serif" font-size="10"
          text-anchor="middle" fill="#2E7D32">0</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <title>Board 3 — 12-tile headless smoke board</title>
  <desc>5x3 rectangular perimeter. 12 tiles. Index 0 = START (top-left). Clockwise numbering.</desc>

  <rect x="0" y="0" width="500" height="300" fill="#F5F5F5" stroke="#222" stroke-width="2"/>

  <!-- inner play area (merged center: row 1, cols 1-3) -->
  <rect x="100" y="100" width="300" height="100" fill="#FAFAFA" stroke="#222" stroke-width="1"/>

  <!-- top row (left to right): 0 (START) / 1 / 2 / 3 / 4 -->
  <g>
    <rect x="0" y="0" width="100" height="100" fill="#FFF" stroke="#222"/>
    <text x="50" y="50" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"
          text-anchor="middle" fill="#333">START</text>
    <text x="50" y="70" font-family="Inter,Arial,sans-serif" font-size="10"
          text-anchor="middle" fill="#999">0</text>
  </g>
  <g><rect x="100" y="0" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="150" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">1</text></g>
  <g><rect x="200" y="0" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="250" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">2</text></g>
  <g><rect x="300" y="0" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="350" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">3</text></g>
  <g><rect x="400" y="0" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="450" y="55" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">4</text></g>

  <!-- right column middle: 5 -->
  <g><rect x="400" y="100" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="450" y="155" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">5</text></g>

  <!-- bottom row (right to left): 6 / 7 / 8 / 9 / 10 -->
  <g><rect x="400" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="450" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">6</text></g>
  <g><rect x="300" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="350" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">7</text></g>
  <g><rect x="200" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="250" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">8</text></g>
  <g><rect x="100" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="150" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">9</text></g>
  <g><rect x="0" y="200" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="50" y="255" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">10</text></g>

  <!-- left column middle: 11 -->
  <g><rect x="0" y="100" width="100" height="100" fill="#FFF" stroke="#222"/>
     <text x="50" y="155" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#999">11</text></g>
</svg>

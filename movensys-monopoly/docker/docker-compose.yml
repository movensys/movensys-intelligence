# Explicit project name — without it compose derives the project from
# the parent directory ("docker"), which collides with the sibling
# movensys_vlm and movensys_manipulator compose files that also live
# under their own docker/ subdir. With shared project names,
# --remove-orphans from one stack wipes the other stacks' containers.
name: movensys-monopoly

services:
  monopoly:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - ROS_DISTRO=${ROS_DISTRO:-jazzy}
    image: movensys_monopoly_image:latest
    container_name: movensys_monopoly_container
    environment:
      # ROS 2
      - ROS_DISTRO=${ROS_DISTRO:-jazzy}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # FastAPI
      - MONOPOLY_PORT=${MONOPOLY_PORT:-8000}
      - MONOPOLY_LOG_LEVEL=${MONOPOLY_LOG_LEVEL:-INFO}
      - MONOPOLY_DEBUG_ROUTES=${MONOPOLY_DEBUG_ROUTES:-true}
      # External FastAPI adapters (empty -> stub mode, PRD 8.x)
      - STT_SERVICE_URL=${STT_SERVICE_URL:-}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL:-}
      - ROBOT_SERVICE_URL=${ROBOT_SERVICE_URL:-}
      # Isaac Sim card-spawn publisher (PRD 11.5)
      - MONOPOLY_ISAAC_TOPIC_CARD_SPAWN=${MONOPOLY_ISAAC_TOPIC_CARD_SPAWN:-/isaac/card_spawn}
      # Optional persistence (PRD 11.3)
      - MONOPOLY_PERSISTENCE_PATH=${MONOPOLY_PERSISTENCE_PATH:-}
    restart: unless-stopped
    network_mode: host
    # Docker-native readiness probe — surfaces in `docker ps` as
    # "healthy"/"starting"/"unhealthy". Wrapper scripts (docker/run.sh)
    # wait on this before declaring the container up.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${MONOPOLY_PORT:-8000}/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6

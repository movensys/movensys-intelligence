# PushT imitation features of movensys_push_t (imitation_node.py). Values follow
# movensys-imitation config/dobot_cr3a/{task,guard,scorer,recorder}.yaml unless noted.
mode: sim                       # sim | real (override with PUSHT_MODE); picks datasets/calibration/<mode>

task:
  # Push area = the target sheet, metres in world_manipulator (9a scene: push_t/add_push_t.py).
  area_center: [-0.03, -0.05]
  area_size: [0.60, 0.30]
  table_z: 0.0431               # sim table top; real: measure
  link6_to_tip_bottom: 0.22     # dobot_cr3a_custom_tool: Link6 -> tool_tcp
  tip_clearance_nominal: 0.010  # tip bottom above the table while pushing
  home_candidates: [[-0.03, 0.08], [-0.25, 0.08], [0.19, 0.08]]

guard:
  auto_enable: true             # enable the guard at startup once the arm pose and Servo are up
  # Operator input: keyboard_teleop (p mode) remapped to /pusht/target_raw, see doc/running.md.
  external_arm_radius: 0.03     # m; keyboard_teleop targets count once one is this close to the guarded target
  latch_mode: nominal           # nominal: push height = table + tip + clearance (sim);
                                # measured: latch where the tool is (real: park at push height first)
  stream_hz: 50.0
  step_limit: 0.005             # m per cycle (0.25 m/s at 50 Hz)
  eef_distance_limit: 0.030     # m the target may lead the measured Link6
  lift_height: 0.08             # m above the push plane while homing and scoring
  eef_stale: 0.5
  pose_stale: 0.5               # s without a new target (keyboard_teleop, policy) -> hold

camera:
  image_stale: 0.5              # s; older frames are not recorded (frames come from a ring buffer)
  roi_margin: 0.0               # m added around the push area (guarded area) for Auto ROI

recorder:
  fps: 10
  image_size: 256
  # The ROI image stored and fed to the policy is grayscale (gray value in all three channels).
  max_image_age: 0.15           # s (wall clock) between frame arrival and the tick
  tick_tolerance: 0.02

episodes:
  episode_seconds: 30.0         # teleop: longest episode (Stop ends it earlier); policy: always this long
  home_tolerance: 0.008         # m
  home_timeout: 30.0            # s
  lift_timeout: 10.0
  lower_settle: 0.5

# Host-side policy learning for movensys_push_t (package learning/). Installed into
# movensys_push_t/.venv by setup_venv.sh; the push_t container does not use it.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movensys-push-t-learning"
version = "0.1.0"
description = "Train and run PushT policies (Diffusion, Flow Matching, ACT) on movensys_push_t recordings."
requires-python = ">=3.12"
# torch / torchvision come first from the CUDA index (setup_venv.sh); LeRobot's pins
# (torch >= 2.7, < 2.12) are then already satisfied.
dependencies = [
    "lerobot[diffusers-dep,dataset,training]==0.6.1",
    "pyyaml>=6",
    # Shadow apt packages built against numpy 1.26 that would leak in through
    # --system-site-packages (diffusers imports scipy.stats).
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
viz = ["rerun-sdk"]   # lerobot-dataset-viz

[project.scripts]
pusht-train = "learning.cli:train"
pusht-eval = "learning.cli:evaluate"
pusht-to-lerobot = "learning.to_lerobot:main"
pusht-offline-check = "learning.offline_check:main"
pusht-policy-runner = "learning.policy_runner:main"

[tool.setuptools.packages.find]
include = ["learning*"]

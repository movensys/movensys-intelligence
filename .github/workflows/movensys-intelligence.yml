name: CI - movensys_vlm

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'movensys_vlm/**'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install Python dependencies
        run: |
          if [ "${{ matrix.ros_distro }}" = "jazzy" ]; then
            pip3 install --no-cache-dir --break-system-packages \
              fastapi "uvicorn[standard]" pydantic "openai>=1.30.0" Pillow
          else
            pip3 install --no-cache-dir \
              fastapi "uvicorn[standard]" pydantic "openai>=1.30.0" Pillow
          fi

      - name: Test Python syntax
        run: |
          for f in main.py router.py ros2_node.py; do
            echo "=== syntax check: $f ==="
            python3 -m py_compile ${{ github.workspace }}/movensys_vlm/$f
            echo "  OK"
          done

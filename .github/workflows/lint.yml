name: Lint

on:
  pull_request:
    branches: [main, devel]

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: flake8 (${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 flake8-bugbear

      - name: flake8 movensys_sample/movensys_robopoly
        run: |
          flake8 movensys_sample/movensys_robopoly \
            --exclude=.venv,__pycache__,build,dist

      - name: flake8 movensys_vlm
        run: |
          flake8 movensys_vlm \
            --exclude=.venv,__pycache__,models,static

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movensys — VLM</title>
<link rel="stylesheet" href="/cameras-page.css" />
</head>
<body>

<header>
  <h1>VLM Inference</h1>
  <div id="health-dot" title="Backend health"></div>
  <a href="/cameras" style="margin-left:auto">Cameras →</a>
  <a href="/">← Control Panel</a>
</header>

<div class="page">

  <div class="vlm-section">
    <div class="vlm-header">
      <h2>✨ Ask VLM</h2>
      <span class="stream-dot" id="vlm-loop-dot" style="margin-left:auto"></span>
      <span style="font-size:0.72rem;color:#475569;margin-left:4px" id="vlm-loop-status">idle</span>
    </div>
    <div class="vlm-body vlm-split">
      <!-- Left: query + response -->
      <div class="vlm-col vlm-col-query">
        <div class="vlm-col-header">
          <span class="vlm-col-title">Query &amp; response</span>
        </div>
        <div class="vlm-controls">
          <select id="vlm-camera" title="Source camera">
            <option value="top">top camera</option>
            <option value="hand">hand camera</option>
            <option value="none">no image (chat only)</option>
          </select>
          <input id="vlm-prompt" type="text"
                 placeholder="Ask about the board… (empty = default description)" />
          <button id="vlm-ask" class="vlm-btn">Ask</button>
        </div>
        <div class="vlm-controls">
          <label class="vlm-check">
            <input id="vlm-repeat" type="checkbox" />
            <span>Repeat every</span>
          </label>
          <select id="vlm-interval" title="Repeat interval">
            <option value="5">5 s</option>
            <option value="10" selected>10 s</option>
            <option value="20">20 s</option>
            <option value="30">30 s</option>
            <option value="60">60 s</option>
          </select>
          <span class="vlm-meta" id="vlm-mem-status" style="margin-left:auto">memory: —</span>
          <button id="vlm-mem-clear" class="vlm-btn vlm-btn-secondary"
                  title="Delete all stored memories from the vector DB">Clear memory</button>
        </div>
        <div id="vlm-response" class="vlm-response empty">No response yet.</div>
        <div id="vlm-meta" class="vlm-meta"></div>
        <div class="vlm-mic-bay">
          <select id="vlm-mic-device" class="vlm-mic-select" title="Microphone device">
            <option value="">Default microphone</option>
          </select>
          <button id="vlm-mic" class="vlm-mic-circle"
                  title="Record voice and transcribe via Whisper">Rec</button>
        </div>
      </div>

      <!-- Middle: image sent to VLM -->
      <div class="vlm-col vlm-col-image">
        <div class="vlm-col-header">
          <span class="vlm-col-title">Image sent to VLM</span>
          <label class="vlm-check" style="margin-left:auto">
            <input id="vlm-rotate180" type="checkbox" />
            <span>Rotate 180°</span>
          </label>
          <span class="vlm-meta" id="vlm-img-meta"></span>
        </div>
        <div class="vlm-sent-frame">
          <img id="vlm-sent-image" class="vlm-sent-img" alt="" />
          <div class="vlm-sent-placeholder" id="vlm-img-placeholder">No image yet — click Ask to capture.</div>
        </div>
      </div>

      <!-- Right: editable system prompt -->
      <div class="vlm-col vlm-col-prompt">
        <div class="vlm-col-header">
          <span class="vlm-col-title">System prompt</span>
          <span class="vlm-meta" id="vlm-sp-status"></span>
        </div>
        <textarea id="vlm-system-prompt" class="vlm-textarea"
                  placeholder="Loading system prompt…" spellcheck="false"></textarea>
        <div class="vlm-controls">
          <button id="vlm-sp-save" class="vlm-btn">Save</button>
          <button id="vlm-sp-reset" class="vlm-btn vlm-btn-secondary" title="Reset to default">Reset</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';

async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    document.getElementById('health-dot').className = r.ok ? 'ok' : 'err';
  } catch {
    document.getElementById('health-dot').className = 'err';
  }
}
checkHealth();
setInterval(checkHealth, 10000);

// VLM inference
const vlmCamera        = document.getElementById('vlm-camera');
const vlmPrompt        = document.getElementById('vlm-prompt');
const vlmAsk           = document.getElementById('vlm-ask');
const vlmRepeat        = document.getElementById('vlm-repeat');
const vlmInterval      = document.getElementById('vlm-interval');
const vlmResponse      = document.getElementById('vlm-response');
const vlmMeta          = document.getElementById('vlm-meta');
const vlmLoopDot       = document.getElementById('vlm-loop-dot');
const vlmLoopLabel     = document.getElementById('vlm-loop-status');
const vlmSentImage     = document.getElementById('vlm-sent-image');
const vlmImgPlaceholder = document.getElementById('vlm-img-placeholder');
const vlmImgMeta       = document.getElementById('vlm-img-meta');
const vlmRotate180     = document.getElementById('vlm-rotate180');

vlmSentImage.addEventListener('error', () => {
  vlmSentImage.classList.remove('has-image');
  vlmImgPlaceholder.classList.remove('hidden');
  vlmImgPlaceholder.textContent = 'Failed to render captured image.';
});

let vlmLoopTimer = null;
let vlmInFlight  = false;

async function askVlmOnce() {
  if (vlmInFlight) return;
  vlmInFlight = true;

  const camera = vlmCamera.value;
  const prompt = vlmPrompt.value.trim();

  vlmAsk.disabled = true;
  vlmAsk.textContent = 'Thinking…';
  vlmResponse.className = 'vlm-response empty';
  vlmResponse.textContent = 'Waiting for VLM response…';

  const started = performance.now();
  try {
    const r = await fetch('/api/vlm/infer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera, prompt: prompt || null, rotate180: vlmRotate180.checked }),
    });
    const body = await r.json();
    const elapsedMs = Math.round(performance.now() - started);

    if (!r.ok) {
      vlmResponse.className = 'vlm-response error';
      vlmResponse.textContent = body.detail || `HTTP ${r.status}`;
      vlmMeta.textContent = `camera=${camera} · ${elapsedMs} ms`;
      return;
    }

    vlmResponse.className = 'vlm-response';
    vlmResponse.textContent = body.response || '(empty response)';
    const wh = (body.width && body.height) ? `${body.width}×${body.height}` : '—';
    const ts = new Date().toLocaleTimeString();
    vlmMeta.textContent = `camera=${body.camera} · frame=${wh} · ${elapsedMs} ms · ${ts}`;
    vlmImgMeta.textContent = body.image
      ? `sent ${wh} · ${ts}`
      : `chat only · ${ts}`;
  } catch (err) {
    vlmResponse.className = 'vlm-response error';
    vlmResponse.textContent = String(err);
  } finally {
    vlmInFlight = false;
    vlmAsk.disabled = false;
    vlmAsk.textContent = 'Ask';
  }
}

function scheduleNextVlm() {
  if (!vlmRepeat.checked) return;
  const delayMs = Number(vlmInterval.value) * 1000;
  vlmLoopTimer = setTimeout(async () => {
    if (!vlmRepeat.checked) return;
    await askVlmOnce();
    scheduleNextVlm();
  }, delayMs);
}

function stopVlmLoop() {
  if (vlmLoopTimer !== null) { clearTimeout(vlmLoopTimer); vlmLoopTimer = null; }
  vlmLoopDot.classList.remove('live');
  vlmLoopLabel.textContent = 'idle';
}

function startVlmLoop() {
  stopVlmLoop();
  vlmLoopDot.classList.add('live');
  vlmLoopLabel.textContent = `every ${vlmInterval.value}s`;
  askVlmOnce().then(scheduleNextVlm);
}

vlmAsk.addEventListener('click', () => {
  if (vlmRepeat.checked) startVlmLoop(); else askVlmOnce();
});

// Live camera preview — middle panel mirrors the selected camera via WebSocket
let cameraWs = null;
function setActiveCameraStream(cam) {
  if (cameraWs) { try { cameraWs.close(); } catch {} cameraWs = null; }
  if (cam === 'none') {
    vlmSentImage.removeAttribute('src');
    vlmSentImage.classList.remove('has-image');
    vlmImgPlaceholder.classList.remove('hidden');
    vlmImgPlaceholder.textContent = 'no camera selected';
    vlmImgMeta.textContent = '';
    return;
  }
  const path = cam === 'top' ? '/api/stream/image_top/rgb' : '/api/stream/image_hand/rgb';
  const ws = new WebSocket(`${proto}//${location.host}${path}`);
  cameraWs = ws;
  ws.onmessage = (evt) => {
    const payload = JSON.parse(evt.data);
    if (payload.error || !payload.data?.data) return;
    const d = payload.data;
    vlmSentImage.src = `data:image/jpeg;base64,${d.data}`;
    vlmSentImage.classList.add('has-image');
    vlmImgPlaceholder.classList.add('hidden');
    if (!vlmImgMeta.textContent.startsWith('sent ')) {
      vlmImgMeta.textContent = `${d.width}×${d.height} · live`;
    }
  };
  ws.onclose = () => {
    if (cameraWs === ws) setTimeout(() => setActiveCameraStream(vlmCamera.value), 3000);
  };
}
vlmCamera.addEventListener('change', () => setActiveCameraStream(vlmCamera.value));
vlmRotate180.addEventListener('change', () => {
  vlmSentImage.classList.toggle('rotate180', vlmRotate180.checked);
});
setActiveCameraStream(vlmCamera.value);

// Whisper STT — record audio and inject transcription into vlm-prompt
const vlmMic = document.getElementById('vlm-mic');
const vlmMicDevice = document.getElementById('vlm-mic-device');
let mediaRecorder = null;
let recChunks = [];
let isRecording = false;

async function populateMicDevices() {
  if (!navigator.mediaDevices?.enumerateDevices) return;
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const audioInputs = devices.filter((d) => d.kind === 'audioinput');
    const previous = vlmMicDevice.value;
    vlmMicDevice.innerHTML = '<option value="">Default microphone</option>';
    audioInputs.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Microphone ${i + 1}`;
      vlmMicDevice.appendChild(opt);
    });
    if (previous && [...vlmMicDevice.options].some((o) => o.value === previous)) {
      vlmMicDevice.value = previous;
    }
  } catch (err) {
    console.warn('enumerateDevices failed:', err);
  }
}
populateMicDevices();
navigator.mediaDevices?.addEventListener?.('devicechange', populateMicDevices);

async function startRecording() {
  try {
    const deviceId = vlmMicDevice.value;
    const constraints = { audio: deviceId ? { deviceId: { exact: deviceId } } : true };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    // Labels are only revealed after permission is granted — repopulate.
    populateMicDevices();
    mediaRecorder = new MediaRecorder(stream);
    recChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      await transcribeAudio(blob);
    };
    mediaRecorder.start();
    isRecording = true;
    vlmMic.textContent = 'Stop';
    vlmMic.classList.add('recording');
  } catch (err) {
    alert(`Mic unavailable: ${err}`);
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
  }
}

async function transcribeAudio(blob) {
  vlmMic.disabled = true;
  vlmMic.textContent = '…';
  try {
    const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
    const form = new FormData();
    form.append('file', blob, `mic.${ext}`);
    const r = await fetch('/api/whisper/transcribe', { method: 'POST', body: form });
    const body = await r.json();
    if (body.error) {
      alert(`Transcribe failed: ${body.error}`);
    } else if (body.text) {
      vlmPrompt.value = body.text.trim();
      vlmPrompt.focus();
    }
  } catch (err) {
    alert(`Transcribe failed: ${err}`);
  } finally {
    vlmMic.disabled = false;
    vlmMic.textContent = 'Rec';
    vlmMic.classList.remove('recording');
  }
}

vlmMic.addEventListener('click', () => {
  if (isRecording) stopRecording(); else startRecording();
});
vlmPrompt.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (vlmRepeat.checked) startVlmLoop(); else askVlmOnce();
  }
});
vlmRepeat.addEventListener('change', () => {
  if (vlmRepeat.checked) startVlmLoop(); else stopVlmLoop();
});
vlmInterval.addEventListener('change', () => {
  if (vlmRepeat.checked) {
    vlmLoopLabel.textContent = `every ${vlmInterval.value}s`;
    if (vlmLoopTimer !== null) { clearTimeout(vlmLoopTimer); vlmLoopTimer = null; }
    if (!vlmInFlight) scheduleNextVlm();
  }
});

// VLM system prompt (editable)
const vlmSP       = document.getElementById('vlm-system-prompt');
const vlmSPSave   = document.getElementById('vlm-sp-save');
const vlmSPReset  = document.getElementById('vlm-sp-reset');
const vlmSPStatus = document.getElementById('vlm-sp-status');

let vlmSPServer = '';

function setSPStatus(text, isError = false) {
  vlmSPStatus.textContent = text;
  vlmSPStatus.style.color = isError ? '#fca5a5' : '#64748b';
}

function updateSPDirty() {
  const dirty = vlmSP.value !== vlmSPServer;
  vlmSPSave.disabled = !dirty;
  if (dirty) setSPStatus('unsaved changes');
}

async function loadSystemPrompt() {
  try {
    const r = await fetch('/api/vlm/system_prompt');
    const body = await r.json();
    vlmSPServer = body.system_prompt || '';
    vlmSP.value = vlmSPServer;
    setSPStatus('loaded');
    vlmSPSave.disabled = true;
  } catch (err) {
    setSPStatus(`load failed: ${err}`, true);
  }
}

async function saveSystemPrompt() {
  vlmSPSave.disabled = true;
  setSPStatus('saving…');
  try {
    const r = await fetch('/api/vlm/system_prompt', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_prompt: vlmSP.value }),
    });
    const body = await r.json();
    if (!r.ok) { setSPStatus(body.detail || `HTTP ${r.status}`, true); return; }
    vlmSPServer = body.system_prompt;
    vlmSP.value = vlmSPServer;
    setSPStatus('saved');
  } catch (err) {
    setSPStatus(`save failed: ${err}`, true);
  } finally {
    updateSPDirty();
  }
}

async function resetSystemPrompt() {
  if (!confirm('Reset system prompt to default?')) return;
  setSPStatus('resetting…');
  try {
    const r = await fetch('/api/vlm/system_prompt', { method: 'DELETE' });
    const body = await r.json();
    if (!r.ok) { setSPStatus(body.detail || `HTTP ${r.status}`, true); return; }
    vlmSPServer = body.system_prompt;
    vlmSP.value = vlmSPServer;
    setSPStatus('reset to default');
    vlmSPSave.disabled = true;
  } catch (err) {
    setSPStatus(`reset failed: ${err}`, true);
  }
}

vlmSP.addEventListener('input', updateSPDirty);
vlmSPSave.addEventListener('click', saveSystemPrompt);
vlmSPReset.addEventListener('click', resetSystemPrompt);
loadSystemPrompt();

// VLM memory (vector DB)
const vlmMemStatus = document.getElementById('vlm-mem-status');
const vlmMemClear  = document.getElementById('vlm-mem-clear');

async function refreshMemoryStatus() {
  try {
    const r = await fetch('/api/vlm/memory');
    const body = await r.json();
    if (!r.ok) { vlmMemStatus.textContent = 'memory: error'; return; }
    const tag = body.enabled ? '' : ' (disabled)';
    vlmMemStatus.textContent = body.count === null
      ? `memory: unreachable${tag}`
      : `memory: ${body.count} stored${tag}`;
  } catch {
    vlmMemStatus.textContent = 'memory: unreachable';
  }
}

async function clearMemory() {
  if (!confirm('Delete all stored memories from the vector DB? This cannot be undone.')) return;
  vlmMemClear.disabled = true;
  const prev = vlmMemClear.textContent;
  vlmMemClear.textContent = 'Clearing…';
  try {
    const r = await fetch('/api/vlm/memory', { method: 'DELETE' });
    const body = await r.json();
    if (!r.ok || !body.ok) {
      alert(`Clear failed: ${body.error || r.status}`);
    }
  } catch (err) {
    alert(`Clear failed: ${err}`);
  } finally {
    vlmMemClear.disabled = false;
    vlmMemClear.textContent = prev;
    refreshMemoryStatus();
  }
}

vlmMemClear.addEventListener('click', clearMemory);
refreshMemoryStatus();
setInterval(refreshMemoryStatus, 5000);

// Refresh the memory counter right after every inference so the user sees the
// store land. Wrap the existing askVlmOnce so we don't fight with it.
const _askVlmOnceOrig = askVlmOnce;
askVlmOnce = async function() {
  await _askVlmOnceOrig();
  refreshMemoryStatus();
};
</script>
</body>
</html>

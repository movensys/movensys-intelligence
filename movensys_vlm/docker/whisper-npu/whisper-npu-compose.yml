services:
  whisper-npu:
    image: whisper-npu:openvino
    build:
      context: .
      dockerfile: Dockerfile.whisper-npu
    container_name: whisper-npu
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      # Intel NPU userspace talks to the kernel via /dev/accel/accel0 on
      # 6.x kernels. Mount the parent dir so accelN renames don't break us.
      - /dev/accel:/dev/accel
    group_add:
      # /dev/accel/accel0 is owned by the `render` group on Ubuntu 24.04.
      # Resolve the host's render GID with `getent group render | cut -d: -f3`
      # and override via .env if it isn't 110.
      - "${RENDER_GID:-110}"
    volumes:
      - ~/models:/models
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - WHISPER_MODEL_REPO=${WHISPER_MODEL_REPO:-FluidInference/whisper-large-v3-turbo-int4-ov-npu}
      - WHISPER_MODEL_DIR=${WHISPER_MODEL_DIR:-/models/whisper-large-v3-turbo-int4-ov-npu}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-NPU}
      - WHISPER_DEFAULT_LANGUAGE=${WHISPER_DEFAULT_LANGUAGE:-}
      - HF_TOKEN=${HF_TOKEN:-}

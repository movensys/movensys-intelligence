x-common: &common
  container_name: vllm_container
  image: vllm_image
  restart: unless-stopped
  build:
    context: .
    dockerfile: vllm.Dockerfile
  network_mode: host
  ipc: host
  privileged: true
  ports:
      - "9000:9000"
  devices:
      - /dev/dri:/dev/dri
  volumes:
    - &models-vol ../models:/models

services:
  # ── NVIDIA Jetson AGX Thor ──────────────────────────────────────────────────
  vllm-nvidia:
    <<: *common
    profiles: [nvidia-gpu]
    runtime: nvidia
    environment:
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
    command:
      - vllm
      - serve
      - /models/gemma-4-E4B-it
      - --served-model-name=gemma-4-e4b-it
      - --port=9000
      - --max-model-len=8192
      - --gpu-memory-utilization=0.6

  # ── Intel Panther Lake XPU ──────────────────────────────────────────────────
  vllm-xpu:
    <<: *common
    profiles: [intel-xpu]
    volumes:
      - *models-vol
      - /dev/dri/by-path:/dev/dri/by-path
    command:
      - vllm
      - serve
      - /models/gemma-4-E4B-it
      - --served-model-name=gemma-4-e4b-it
      - --port=9000
      - --max-model-len=1024
      - --dtype=float16
      - --gpu-memory-utilization=0.4
      - --attention-backend=TRITON_ATTN
      - --enforce-eager
      - '--limit-mm-per-prompt={"image": 1, "video": 0}'

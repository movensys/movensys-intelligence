# Vector DB stack for VLM long-term memory.
#
# Two services, identical on every host (no profiles — XPU_CORE is irrelevant
# here, unlike vllm.yaml / whisper.yaml):
#   * qdrant — vector store (single-binary, multi-arch image; runs on both
#     Jetson AGX Thor / arm64 and Panther Lake / amd64).
#   * embed  — HuggingFace text-embeddings-inference, CPU image. The embedding
#     model is small (~120 MB for multilingual-e5-small) so CPU is fine on edge.
#
# Bring-up (from this directory):
#   docker compose -f vectordb.yaml down
#   docker compose -f vectordb.yaml up -d

x-common: &common
  restart: unless-stopped
  network_mode: host

services:
  qdrant:
    <<: *common
    container_name: qdrant_container
    image: qdrant/qdrant:v1.13.0
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"

  embed:
    <<: *common
    container_name: embed_container
    # Override host networking from x-common. TEI binds a Prometheus metrics
    # listener on :9000 (not configurable in the cpu-1.6 CLI), which collides
    # with vllm on the host. Bridge networking keeps that listener inside the
    # container's namespace; only the API port is published. TEI does not need
    # to reach qdrant, so it loses nothing by leaving the host network.
    network_mode: bridge
    ports:
      - "9020:9020"
    # cpu-1.5 ships hf-hub 0.3.2 which mishandles an empty HF_TOKEN env var and
    # crashes with "relative URL without a base" before download even starts.
    # cpu-1.6+ has the fix. Token vars are intentionally NOT passed: the
    # default embedding model is public and an empty token re-triggers the bug.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    volumes:
      - ../models/embeddings:/data
    command:
      - --model-id=${EMBED_MODEL_ID}
      - --port=9020
      - --hostname=0.0.0.0
      - --huggingface-hub-cache=/data

volumes:
  qdrant_storage:
